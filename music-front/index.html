<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đoán tên bài hát</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main class="main-container">
      <h1>Đoán tên bài hát</h1>

      <div class="genre-selection">
        <p>Chọn thể loại nhạc:</p>
        <button
          type="button"
          class="genre-button"
          data-genre="Vpop"
          aria-pressed="false"
        >
          Vpop
        </button>
        <button
          type="button"
          class="genre-button"
          data-genre="Jpop"
          aria-pressed="false"
        >
          Jpop
        </button>

        <button type="button" class="reset-button">Reset</button>
      </div>

      <p id="message">Chọn Vpop hoặc Jpop để bắt đầu</p>
      <div class="game-container">
        <div class="modal" id="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h1>YOUR FINAL SCORE</h1>
            <p id="final-score"></p>
          </div>

        </div>

        <div id="game-container" hidden>
          <p id="score">Điểm: 0</p>
          <p id="listen-status">Mức nghe: --</p>

          <audio id="audio-player"></audio>

          <div class="volume-control">
            <label for="volume-slider">Âm lượng</label>
            <input
              id="volume-slider"
              type="range"
              min="0"
              max="100"
              value="100"
              aria-describedby="volume-value"
            />
            <output id="volume-value" for="volume-slider">100%</output>
          </div>

          <form id="guess-form">
            <input
              id="guess-input"
              type="text"
              placeholder="Nhập tên bài hát..."
              autocomplete="off"
              disabled
            />
            <button id="guess-button" type="submit" disabled>Guees 🔍</button>
          </form>

          <button id="listen-more-button" type="button" disabled>More</button>
          <button id="replay-button" type="button" disabled>Replay 🔊</button>

          <button id="skip-button" type="button" disabled>Skip</button>

          <button id="next-button" type="button" disabled>Start</button>

          <button id="retry-button" type="button" hidden>Wanna Retry ? 🔄</button>
          <span id="time-down"></span>
          <div class="song-info">
            <p id="song-title"></p>
            <p id="song-artist" font-text="strong"></p>
            <p id="song-genre"></p>
          </div>
        </div>
      </div>

      <div class="all-songs-container">
        <div id="all-songs-container" hidden>
          <h2 id="all-songs-title">Tất cả bài hát</h2>
          <ul id="all-songs-list"></ul>
        </div>
      </div>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
